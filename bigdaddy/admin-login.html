<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin Login — Big Daddy</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #080810;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Inter, system-ui, sans-serif;
      color: #f5f5f5;
      padding: 24px;
    }

    .login-wrapper {
      width: 100%;
      max-width: 420px;
    }

    .login-logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-logo .logo-icon {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #e8c872, #b8973a);
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      margin-bottom: 12px;
    }

    .login-logo h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #e8c872;
      letter-spacing: -0.01em;
    }

    .login-logo p {
      font-size: 0.85rem;
      color: #6b7280;
      margin-top: 4px;
    }

    .login-card {
      background: #111118;
      border: 1px solid #1e1e2e;
      border-radius: 16px;
      padding: 36px 32px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
    }

    .login-card h2 {
      font-size: 1.15rem;
      font-weight: 600;
      color: #f0f0f0;
      margin-bottom: 6px;
    }

    .login-card .sub {
      font-size: 0.82rem;
      color: #6b7280;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #9ca3af;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .input-wrap {
      position: relative;
      margin-bottom: 20px;
    }

    .input-wrap input {
      width: 100%;
      padding: 13px 44px 13px 16px;
      background: #0a0a14;
      border: 1px solid #2a2a3e;
      border-radius: 10px;
      color: #fff;
      font-size: 0.95rem;
      font-family: inherit;
      transition: border-color 0.2s;
      outline: none;
    }

    .input-wrap input:focus {
      border-color: #e8c872;
      box-shadow: 0 0 0 3px rgba(232, 200, 114, 0.12);
    }

    .input-wrap input::placeholder {
      color: #3a3a50;
    }

    .toggle-pw {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #6b7280;
      font-size: 1.1rem;
      padding: 0;
      line-height: 1;
    }

    .toggle-pw:hover { color: #e8c872; }

    .error-msg {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 8px;
      color: #f87171;
      font-size: 0.82rem;
      padding: 10px 14px;
      margin-bottom: 16px;
      display: none;
    }

    .error-msg.show { display: block; }

    .btn-login {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #e8c872, #b8973a);
      border: none;
      border-radius: 10px;
      color: #0a0808;
      font-size: 0.95rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-login:hover { opacity: 0.92; }
    .btn-login:active { transform: scale(0.98); }
    .btn-login:disabled { opacity: 0.5; cursor: not-allowed; }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(0,0,0,0.3);
      border-top-color: #000;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }

    .btn-login.loading .spinner { display: block; }
    .btn-login.loading .btn-text { opacity: 0.7; }

    @keyframes spin { to { transform: rotate(360deg); } }

    .footer-note {
      text-align: center;
      font-size: 0.75rem;
      color: #3a3a50;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-logo">
      <div class="logo-icon">👑</div>
      <h1>Big Daddy Admin</h1>
      <p>Restricted access — authorized personnel only</p>
    </div>

    <div class="login-card">
      <h2>Sign in to Admin Panel</h2>
      <p class="sub">Enter your admin password to manage the website, view visitors, and update settings.</p>

      <form id="loginForm" autocomplete="off">
        <label for="passwordInput">Admin Password</label>
        <div class="input-wrap">
          <input type="password" id="passwordInput" placeholder="Enter password…" autocomplete="current-password" required>
          <button type="button" class="toggle-pw" id="togglePw" aria-label="Show/hide password">👁</button>
        </div>

        <div class="error-msg" id="errorMsg">Incorrect password. Please try again.</div>

        <button type="submit" class="btn-login" id="loginBtn">
          <div class="spinner"></div>
          <span class="btn-text">Sign in as Admin</span>
        </button>
      </form>
    </div>

    <p class="footer-note">This page is not indexed by search engines.</p>
  </div>

  <script>
    (function () {
      const TOKEN_KEY = 'bdAdminToken';

      // Already logged in — go straight to dashboard
      if (localStorage.getItem(TOKEN_KEY)) {
        fetch('/api/admin/settings', {
          headers: { Authorization: 'Bearer ' + localStorage.getItem(TOKEN_KEY) }
        }).then(function (res) {
          if (res.ok) window.location.replace('/admin.html');
          else localStorage.removeItem(TOKEN_KEY);
        }).catch(function () {});
      }

      // Toggle password visibility
      document.getElementById('togglePw').addEventListener('click', function () {
        const input = document.getElementById('passwordInput');
        input.type = input.type === 'password' ? 'text' : 'password';
        this.textContent = input.type === 'password' ? '👁' : '🙈';
      });

      // Login form
      document.getElementById('loginForm').addEventListener('submit', function (e) {
        e.preventDefault();
        const btn = document.getElementById('loginBtn');
        const errEl = document.getElementById('errorMsg');
        const password = document.getElementById('passwordInput').value;

        errEl.classList.remove('show');
        btn.disabled = true;
        btn.classList.add('loading');

        fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: password }),
        }).then(function (res) {
          if (!res.ok) {
            errEl.classList.add('show');
            btn.disabled = false;
            btn.classList.remove('loading');
            document.getElementById('passwordInput').value = '';
            return null;
          }
          return res.json();
        }).then(function (data) {
          if (!data) return;
          localStorage.setItem(TOKEN_KEY, data.token);
          window.location.replace('/admin.html');
        }).catch(function () {
          errEl.textContent = 'Server error. Make sure the server is running.';
          errEl.classList.add('show');
          btn.disabled = false;
          btn.classList.remove('loading');
        });
      });
    })();
  </script>
</body>
</html>
